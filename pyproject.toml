[project]
name = "correction-aware-memory"
version = "0.1.0"
description = "Auditable correction-aware temporal memory and offline evaluation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cam = "cam.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
